{% extends "base.html" %}
{% block title %}Settings - EmoSense{% endblock %}
{% block content %}
<h1>Settings</h1>
<form method="post" class="card narrow">
  <label>Name <input type="text" name="name" value="{{ g.user['name'] }}" required></label>
  <label class="check">
    <input type="checkbox" name="auto_save" {{ 'checked' if g.user['auto_save'] }}>
    Save detections to my history
  </label>
  <button class="btn" type="submit">Save changes</button>
</form>
{% endblock %}
